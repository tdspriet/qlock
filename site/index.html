<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QLOCK</title>
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23131211'/%3E%3Cg fill='%23ffbe78'%3E%3Crect x='7' y='8' width='5' height='5'/%3E%3Crect x='13.5' y='8' width='5' height='5'/%3E%3Crect x='20' y='19' width='5' height='5'/%3E%3C/g%3E%3Cg fill='%2338342f'%3E%3Crect x='20' y='8' width='5' height='5'/%3E%3Crect x='7' y='19' width='5' height='5'/%3E%3Crect x='13.5' y='19' width='5' height='5'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root {
  --bg: #131211; --card: #1b1a18; --line: #2e2b27; --ink: #ece7df; --muted: #a39c92;
  --accent: #ffbe78; --on-accent: #24180a;
  --face: #0b0a09; --off: #37332e; --lit: #ffdcae;
  --w5: #e5645a; --wg: #948d83; --wd: #e2bd3a;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f2ee; --card: #ffffff; --line: #e4e0d9; --ink: #1e1c1a; --muted: #6a645c;
    --accent: #c8741a; --on-accent: #ffffff;
    --w5: #cf3a2c; --wg: #5d5750; --wd: #b08400;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
  -webkit-text-size-adjust: 100%;
}
main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---- top: the clock and where you are */
.top { display: grid; grid-template-columns: 200px 1fr; gap: 28px; align-items: center; margin-bottom: 28px; }
.face {
  position: relative; aspect-ratio: 1; background: var(--face); border-radius: 3px;
  box-shadow: 0 0 0 1px var(--line);
}
.face .letters {
  position: absolute; inset: 9.26%;
  display: grid; grid-template-columns: repeat(11, 1fr); grid-template-rows: repeat(10, 1fr);
  place-items: center; font-size: 9.5px; font-weight: 600; line-height: 1; color: var(--off);
}
.face .letters .on { color: var(--lit); text-shadow: 0 0 6px rgba(255, 190, 120, .7); }
.face .dot { position: absolute; width: 1.6%; aspect-ratio: 1; border-radius: 50%; background: var(--off); transform: translate(-50%, -50%); }
.face .dot.on { background: var(--lit); box-shadow: 0 0 5px rgba(255, 190, 120, .8); }
h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .28em; color: var(--muted); }
.now { margin: 6px 0 2px; font-size: 26px; font-weight: 650; line-height: 1.2; text-wrap: balance; }
.next { margin: 0 0 16px; color: var(--muted); }
.bar { display: flex; gap: 4px; }
.bar i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar b { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.note { margin: 0 0 20px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); font-size: 14px; }
code { font: .92em ui-monospace, 'SF Mono', Menlo, monospace; }

/* ---- phases */
.phase { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; }
.phase > button {
  display: grid; grid-template-columns: 30px 1fr auto 16px; gap: 12px; align-items: center;
  width: 100%; padding: 16px 18px; background: none; border: 0; text-align: left; cursor: pointer;
}
.num {
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;
  border: 1.5px solid var(--line); color: var(--muted);
}
.phase.done .num { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.phase.current .num { border-color: var(--accent); color: var(--accent); }
.phase .name { font-size: 18px; font-weight: 600; }
.phase.done .name { color: var(--muted); }
.count { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.chev { width: 16px; height: 16px; color: var(--muted); transition: transform .15s; }
.phase > button[aria-expanded="true"] .chev { transform: rotate(180deg); }
.body { padding: 0 18px 18px; }
.intro { margin: 0 0 10px 42px; color: var(--muted); }

/* ---- steps and shopping rows */
ul { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: start; padding: 9px 0; border-top: 1px solid var(--line); }
.row label { display: contents; cursor: pointer; }
input[type="checkbox"] {
  appearance: none; -webkit-appearance: none; margin: 1px 0 0 4px; width: 22px; height: 22px; flex: none;
  border: 1.5px solid var(--muted); border-radius: 7px; cursor: pointer; display: grid; place-items: center;
}
input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
input[type="checkbox"]:checked::after {
  content: ''; width: 5px; height: 10px; margin-top: -2px;
  border: solid var(--on-accent); border-width: 0 2.2px 2.2px 0; transform: rotate(45deg);
}
.t { display: block; }
.h { display: block; color: var(--muted); font-size: 14.5px; }
.row.done .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.row.done .h { display: none; }
.eur { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.qty { color: var(--muted); }
.shop a { text-decoration-color: var(--muted); text-underline-offset: 3px; }
.group { margin: 18px 0 2px 42px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.group b { font-weight: 600; }
.group span { color: var(--muted); font-size: 14px; }
.group .sum { margin-left: auto; }

/* ---- pictures */
figure { margin: 20px 0 0; }
figcaption { color: var(--muted); font-size: 14px; margin-top: 10px; }
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.wiring { display: block; width: 100%; min-width: 620px; height: auto; }
.wiring .w { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.wiring .v5 { stroke: var(--w5); } .wiring .gnd { stroke: var(--wg); } .wiring .data { stroke: var(--wd); }
.wiring .box { fill: var(--bg); stroke: var(--muted); stroke-width: 1.2; }
.wiring .chip { fill: var(--face); stroke: var(--muted); }
.wiring .strip { fill: color-mix(in srgb, var(--accent) 14%, transparent); stroke: var(--accent); }
.wiring .part { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.wiring .plate { fill: none; stroke: var(--ink); stroke-width: 2.2; }
.wiring .node { fill: var(--ink); }
.wiring text { fill: var(--ink); font-size: 14.5px; font-weight: 600; }
.wiring .s { font-size: 12.5px; font-weight: 400; fill: var(--muted); }
.wiring .onchip { fill: #ece6dc; } .wiring .onchip.s { fill: #a8a094; }
table { border-collapse: collapse; margin-top: 14px; font-size: 14.5px; }
td { padding: 5px 16px 5px 0; border-top: 1px solid var(--line); vertical-align: top; }
td:first-child { color: var(--muted); white-space: nowrap; }
.map {
  display: grid; grid-template-columns: repeat(13, 1fr); gap: 3px; min-width: 520px;
  font-size: 15px; font-weight: 600; text-align: center;
}
.map span { aspect-ratio: 1; display: grid; place-content: center; border-radius: 4px; line-height: 1.1; }
.map .led { background: var(--bg); border: 1px solid var(--line); }
.map small { font-size: 9.5px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.map .dotled { border: 1px dashed var(--muted); border-radius: 50%; }
.map .edge { color: var(--muted); font-weight: 400; }
.map .in { color: var(--accent); font-size: 11px; font-weight: 600; }
footer { margin-top: 28px; color: var(--muted); font-size: 14px; text-align: center; }

@media (max-width: 560px) {
  main { padding-top: 20px; }
  .top { grid-template-columns: 112px 1fr; gap: 16px; }
  .face .letters { font-size: 5.5px; }
  .now { font-size: 20px; }
  .next { font-size: 14.5px; margin-bottom: 10px; }
  .phase > button { padding: 14px; }
  .body { padding: 0 14px 14px; }
  .intro, .group { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="face" id="face" role="img"></div>
    <div>
      <h1>QLOCK</h1>
      <p class="now" id="now"></p>
      <p class="next" id="next"></p>
      <div class="bar" id="bar" aria-hidden="true"></div>
    </div>
  </header>
  <p class="note" id="note" hidden>Ticks are only kept in this browser. Start the tracker with <code>python3 site/serve.py</code> to save them in the project.</p>
  <div id="phases"></div>
  <footer>The full guide, with every size and setting, is README.md.</footer>
</main>
