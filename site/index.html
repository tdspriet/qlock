<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QLOCK</title>
<meta name="description" content="Build tracker for a 3D-printed Dutch word clock.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23131211'/%3E%3Cg fill='%23ffbe78'%3E%3Crect x='6' y='7' width='5' height='5'/%3E%3Crect x='13.5' y='7' width='5' height='5'/%3E%3Crect x='21' y='7' width='5' height='5'/%3E%3C/g%3E%3Cg fill='%233a3631'%3E%3Crect x='6' y='14' width='5' height='5'/%3E%3Crect x='13.5' y='14' width='5' height='5'/%3E%3Crect x='21' y='14' width='5' height='5'/%3E%3Crect x='6' y='21' width='5' height='5'/%3E%3C/g%3E%3Cg fill='%23ffbe78'%3E%3Crect x='13.5' y='21' width='5' height='5'/%3E%3Crect x='21' y='21' width='5' height='5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="top">
  <h1 class="brand"><span class="face" id="face"></span>QLOCK</h1>
  <nav class="views" role="tablist" aria-label="Sections" id="views">
    <button type="button" role="tab" data-view="build" aria-controls="view-build">Build</button>
    <button type="button" role="tab" data-view="wiring" aria-controls="view-ref">Wiring</button>
    <button type="button" role="tab" data-view="leds" aria-controls="view-ref">LEDs</button>
    <button type="button" role="tab" data-view="print" aria-controls="view-ref">Printing</button>
    <button type="button" role="tab" data-view="firmware" aria-controls="view-ref">Firmware</button>
  </nav>
  <p class="summary" id="summary"></p>
  <div class="bar" aria-hidden="true"><i id="summary-bar"></i></div>
</header>

<div class="banner" id="banner" hidden></div>

<main class="bench" id="view-build" role="tabpanel" aria-label="Build">
  <section class="col col-plan" aria-labelledby="plan-h">
    <div class="col-head"><h2 id="plan-h">Plan</h2></div>
    <div class="scroll" id="phases"></div>
  </section>

  <section class="col col-model" aria-labelledby="model-h">
    <div class="col-head">
      <h2 id="model-h">Clock</h2>
      <div class="controls">
        <button type="button" class="btn" id="btn-explode" aria-pressed="true">Explode</button>
        <button type="button" class="btn" id="btn-lit" aria-pressed="false">Light up</button>
        <button type="button" class="btn icon" id="btn-reset" aria-label="Reset view" title="Reset view">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.5-3.6M3 2.5v2.5h2.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

    <div class="viewer" id="viewer">
      <div class="v-tip" id="v-tip" hidden></div>
      <div class="v-load" id="v-load">Loading…</div>
      <div class="v-time" id="v-time" hidden>
        <input type="time" id="lit-time" step="300" aria-label="Time shown">
        <button type="button" id="lit-now">Now</button>
      </div>
      <aside class="v-card" id="v-card" hidden></aside>
    </div>

    <div class="todo" id="todo"></div>
  </section>

  <section class="col col-shop" aria-labelledby="shop-h">
    <div class="col-head"><h2 id="shop-h">Shopping</h2></div>
    <div class="scroll">
      <div id="shop"></div>
      <button type="button" class="add-link" id="add-item-open">+ Add item</button>
      <form class="add-item" id="add-item" autocomplete="off" hidden>
        <input id="add-item-name" placeholder="Item" required maxlength="120" aria-label="Item">
        <input id="add-item-price" type="number" min="0" step="0.01" placeholder="€" inputmode="decimal" aria-label="Price">
        <button type="submit">Add</button>
      </form>
    </div>
  </section>
</main>

<main class="ref" id="view-ref" role="tabpanel" hidden></main>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/STLLoader.js"></script>
<script src="data.js"></script>
<script src="clock.js"></script>
<script src="store.js"></script>
<script src="viewer.js"></script>
<script src="wiring.js"></script>
<script src="app.js"></script>
</body>
</html>
